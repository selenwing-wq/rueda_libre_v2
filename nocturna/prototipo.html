
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rueda Nocturna | Rueda Libre</title>

    <!-- Tailwind CSS - Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-950">

    <main class="min-h-screen px-6 py-16">

        <section class="mx-auto w-full max-w-5xl space-y-10">

            <!-- Etiqueta de campaña -->
            <p class="text-sm font-bold uppercase tracking-widest text-orange-400">
                Nuevo · Jueves a sábado
            </p>

            <!-- Título principal -->
            <div class="max-w-4xl space-y-6">

                <h1 class="text-5xl font-extrabold leading-tight tracking-tight text-white">
                    Rueda Nocturna
                </h1>

                <!-- Subtítulo -->
                <p class="max-w-2xl text-xl leading-relaxed text-slate-300">
                    Descubre Medellín en bici cuando se encienden las luces
                </p>

            </div>

            <!-- Datos destacados -->
            <div class="space-y-4 text-lg font-semibold text-white">

                <p class="w-full max-w-xs bg-slate-800 p-5">
                    3 rutas
                </p>

                <p class="w-full max-w-xs bg-slate-800 p-5">
                    Desde $55.000
                </p>

            </div>

            <!-- Llamada a la acción -->
            <div class="pt-4">

                <a
                    href="../paginas/reservas.html"
                    class="inline-block rounded-lg bg-orange-500 px-8 py-4 text-lg font-bold text-slate-950">
                    Inscríbete
                </a>

            </div>

        </section>

    </main>

</body>
</html>
