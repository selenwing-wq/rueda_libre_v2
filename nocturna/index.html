<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rueda Nocturna | Rueda Libre</title>

    <!-- CSS generado por Tailwind CLI -->
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-slate-950">

    <main class="px-6 py-16">

        <section class="mx-auto w-full max-w-5xl space-y-10">

            <!-- Etiqueta de campaña -->
            <p class="text-sm font-bold uppercase tracking-widest text-orange-400">
                Nuevo · Jueves a sábado
            </p>

            <!-- Título y subtítulo -->
            <div class="max-w-4xl space-y-6">

                <h1 class="text-5xl font-extrabold leading-tight tracking-tight text-white">
                    Rueda Nocturna
                </h1>

                <p class="max-w-2xl text-xl leading-relaxed text-slate-300">
                    Descubre Medellín en bici cuando se encienden las luces
                </p>

            </div>

            <!-- Datos destacados -->
            <div id="rutas" class="space-y-4 text-lg font-semibold text-white">

                <p class="w-full max-w-xs rounded-lg bg-slate-800 p-5 shadow-lg">
                    3 rutas
                </p>

                <p class="w-full max-w-xs rounded-lg bg-slate-800 p-5 shadow-lg">
                    Desde $55.000
                </p>

            </div>

            <!-- Variantes de botones -->
            <div class="flex flex-wrap items-center gap-4 pt-4">

                <!-- Botón principal -->
                <a
                    href="../paginas/reservas.html"
                    class="inline-block rounded-lg bg-orange-500 px-8 py-4 text-lg font-bold text-slate-950 shadow-lg transition-colors hover:bg-orange-400 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-orange-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
                    Inscríbete
                </a>

                <!-- Botón secundario -->
                <a
                    href="#rutas"       
                    class="inline-block rounded-lg bg-slate-700 px-8 py-4 text-lg font-bold text-white shadow-lg transition-colors hover:bg-slate-600 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-sky-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
                    Ver las rutas
                </a>

                <!-- Botón de contorno -->
                <a
                    href="../paginas/tarifas.html"
                    class="inline-block rounded-lg border-2 border-orange-400 px-8 py-4 text-lg font-bold text-orange-400 transition-colors hover:bg-orange-400 hover:text-slate-950 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-orange-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
                    Consultar tarifas
                </a>

            </div>

        </section>

    </main>

</body>

</html>
